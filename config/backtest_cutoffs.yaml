# Frozen walk-forward backtest cutoffs, in two sets with two different jobs.
#
# Each entry is the first forecast delivery day (D+1) in German market-local time (Europe/Berlin;
# a delivery day runs 00:00..23:00 local). A tool trains on everything strictly before that local
# midnight and scores forward from it. Both sets are FIXED and hand-picked so every run scores the
# identical days and results stay directly comparable.
#
# development - every SELECTION decision: eex model tune, eex analyze aggregation / ablation /
#   anchors / solar-*, and eex analyze eval / oracle when used as an adoption gate (their default).
#   Keep it balanced: every calendar month, every weekday (Mon-Fri) plus weekends, a few German
#   public holidays (atypical low-demand days), and two plain weekdays at the wind extremes (a
#   near-calm day and the windiest in the span).
#
# holdout - REPORTING only: eex analyze eval --holdout / oracle --holdout. Nothing is ever tuned,
#   ablated, aggregated, ranked or chosen on these days, which is what makes their MAE an honest
#   out-of-sample score. Run it after adopting a change, never to choose between candidates: a
#   holdout result that changes a decision has made the holdout part of selection. The days avoid
#   everything the adopted configuration was selected on - the development days (with a buffer of
#   more than 3 days, enforced by the loader, because adjacent days share weather regimes) and the
#   2025 calendar year the weather anchors were ranked on - so they sit in 2026: two per month,
#   January to September, balanced like the development set. October-December is not covered.
development:
  - "2025-01-01"  # Wed - Neujahr (New Year's Day)
  - "2025-02-17"  # Mon
  - "2025-03-19"  # Wed
  - "2025-04-17"  # Thu
  - "2025-05-16"  # Fri
  - "2025-06-14"  # Sat (weekend)
  - "2025-07-22"  # Tue
  - "2025-08-17"  # Sun (weekend)
  - "2025-08-18"  # Mon - deliberate very-low-wind day (CF ~0.03, 1st pct)
  - "2025-09-18"  # Thu
  - "2025-10-03"  # Fri - Tag der Deutschen Einheit (German Unity Day)
  - "2025-10-24"  # Fri - deliberate very-high-wind day (CF ~0.63, windiest weekday in span)
  - "2025-11-08"  # Sat (weekend)
  - "2025-11-19"  # Wed
  - "2025-12-25"  # Thu - Erster Weihnachtstag (Christmas Day)
  - "2026-01-23"  # Fri
  - "2026-02-09"  # Mon
  - "2026-03-15"  # Sun (weekend)
  - "2026-04-06"  # Mon - Ostermontag (Easter Monday)
  - "2026-05-21"  # Thu
  - "2026-06-17"  # Wed
  - "2026-07-07"  # Tue

